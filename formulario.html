<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido al Sistema - ITCA Cloud</title>
    <style>
        :root {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --accent-color: #4f46e5;
            --accent-hover: #4338ca;
            --text-color: #e5e7eb;
            --text-muted: #9ca3af;
        }
        body {
            font-family: 'Segoe UI', Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: var(--container-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        h1 { font-size: 24px; margin-bottom: 8px; color: #ffffff; }
        .welcome-msg { color: var(--text-muted); font-size: 15px; margin-bottom: 30px; line-height: 1.5; }
        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 14px; margin-bottom: 6px; color: var(--text-muted); }
        input {
            width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #374151;
            background-color: #2d2d2d; color: #ffffff; font-size: 15px; box-sizing: border-box;
        }
        input:focus { outline: none; border-color: var(--accent-color); }
        button {
            width: 100%; padding: 12px; background-color: var(--accent-color); color: #ffffff;
            border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;
            transition: background-color 0.3s; margin-top: 10px;
        }
        button:hover { background-color: var(--accent-hover); }
        #resultado { margin-top: 25px; padding: 15px; border-radius: 6px; font-size: 14px; display: none; line-height: 1.4; }
        .success-box { background-color: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; color: #10b981; }
        .error-box { background-color: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #ef4444; }
    </style>
</head>
<body>
<div class="container">
    <h1>¡Bienvenido!</h1>
    <p class="welcome-msg">Esta aplicación demuestra el despliegue continuo usando contenedores Docker, GitHub Actions y Render de forma completamente automática.</p>
    <form id="registroForm">
        <div class="form-group">
            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" required placeholder="Ej. Juan Pérez">
        </div>
        <div class="form-group">
            <label for="correo">Correo Electrónico:</label>
            <input type="email" id="correo" required placeholder="Ej. usuario@gmail.com">
        </div>
        <button type="submit">Enviar Registro a Render</button>
    </form>
    <div id="resultado"></div>
</div>
<script>
   // Para pruebas locales, deja la URL de localhost activa:
   const URL_BACKEND = 'http://localhost:8000/index.php';
    
    // URL de Render:
     //const URL_BACKEND = 'https://proyecto-php-render-g18o.onrender.com';

    document.getElementById('registroForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const nombre = document.getElementById('nombre').value;
        const correo = document.getElementById('correo').value;
        const resultadoDiv = document.getElementById('resultado');
        resultadoDiv.style.display = 'none';

        try {
            const response = await fetch(URL_BACKEND, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, correo })
            });
            const data = await response.json();
            if (data.status === 'success') {
                resultadoDiv.className = 'success-box';
                resultadoDiv.innerText = data.message;
            } else {
                resultadoDiv.className = 'error-box';
                resultadoDiv.innerText = 'Hubo un problema en la respuesta del servidor.';
            }
        } catch (error) {
            resultadoDiv.className = 'error-box';
            resultadoDiv.innerText = 'Error de conexión: ' + error.message;
        }
        resultadoDiv.style.display = 'block';
    });
</script>
</body>
</html>
